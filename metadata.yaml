name: astrbot_plugin_email_adapter
display_name: Email 适配器
short_desc: 原生 Email 平台适配器(IMAP 收信 / SMTP 发信)，支持多实例与多种服务商。
desc: |
  为 AstrBot 提供原生 Email 平台支持：通过 IMAP 轮询收信、SMTP 发信，
  收发均支持 SSL / STARTTLS / 明文三种加密方式与可选的证书校验，
  适配 Gmail、Outlook、QQ 邮箱、163、自建邮件服务器及各类事务邮件服务。
  回复自动带上会话线程头，可在邮件客户端中正确归组。
version: 0.1.1
author: inertialobs
repo: https://github.com/inertialobs/astrbot_plugin_email_adapter
astrbot_version: ">=4.16.0,<5"
tags:
  - email
  - imap
  - smtp
  - platform-adapter
